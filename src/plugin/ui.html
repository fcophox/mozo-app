<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; --mozo-primary: __MOZO_PRIMARY__; --mozo-on-primary: __MOZO_ON_PRIMARY__; }
  body {
    margin: 0; padding: 14px; font: 12px/1.45 Inter, system-ui, sans-serif;
    color: var(--figma-color-text, #1e1e1e); background: var(--figma-color-bg, #fff);
    display: flex; flex-direction: column; gap: 10px; height: 100vh; box-sizing: border-box;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .mozo-mark { width: 24px; height: 24px; flex: none; border-radius: 6px; }
  h1 { font-size: 14px; margin: 0; }
  .lead { color: inherit; font-weight: 500; }
  p { margin: 0; color: var(--figma-color-text-secondary, #666); }
  .drop {
    position: relative; flex: 1; display: flex; flex-direction: column; border: 1px dashed var(--figma-color-border, #ccc);
    border-radius: 8px; overflow: hidden;
  }
  /* Confirmación tras importar: un check que se dibuja, ~1 s, y la UI vuelve a quedar limpia. */
  .success {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: var(--figma-color-bg, #fff); text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .success.show { opacity: 1; pointer-events: auto; }
  .success svg { width: 56px; height: 56px; }
  .success circle { fill: var(--figma-color-bg-success, #14ae5c); transform-origin: center; }
  .success path { fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 24; stroke-dashoffset: 24; }
  .success.show circle { animation: pop .3s cubic-bezier(.3, 1.5, .6, 1); }
  .success.show path { animation: draw .3s .15s ease-out forwards; }
  .success strong { font-size: 13px; }
  .success span { color: var(--figma-color-text-secondary, #666); }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .success.show circle { animation: none; }
    .success.show path { animation: none; stroke-dashoffset: 0; }
  }
  .drop.over { border-color: var(--mozo-primary); background: var(--figma-color-bg-brand-tertiary, #e5f4ff); }
  textarea {
    flex: 1; resize: none; border: 0; padding: 10px; font: 11px/1.4 ui-monospace, Menlo, monospace;
    background: transparent; color: inherit; outline: none;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit; font-weight: 500; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer;
    background: var(--mozo-primary); color: var(--mozo-on-primary);
  }
  button.secondary { background: var(--figma-color-bg-secondary, #eee); color: inherit; }
  button:disabled { opacity: .5; cursor: default; }
  label.file { cursor: pointer; text-decoration: underline; }
  .status { min-height: 2.9em; }
  .status.error { color: var(--figma-color-text-danger, #d32f2f); }
</style>
</head>
<body>
  <header class="brand">__MOZO_MARK__<h1>Mozō</h1></header>
  <p class="lead">Importar página web</p>
  <p>Ejecuta el capturador en la página, copia el JSON y pégalo aquí, o suelta el archivo <code>.mozo.json</code>.</p>
  <div class="drop" id="drop">
    <textarea id="json" placeholder="Pega aquí el JSON de la captura…" spellcheck="false"></textarea>
    <div class="success" id="success" aria-hidden="true">
      <svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="28" /><path d="M17 29l7 7 15-16" /></svg>
      <strong>Importado correctamente</strong>
      <span id="success-detail"></span>
    </div>
  </div>
  <div class="row">
    <button id="import">Importar</button>
    <button id="cancel" class="secondary" hidden>Cancelar</button>
    <label class="file">o elegir archivo<input id="file" type="file" accept=".json,application/json" hidden /></label>
  </div>
  <p class="status" id="status" role="status"></p>

<script>
  const $ = (id) => document.getElementById(id);
  const textarea = $('json'), importBtn = $('import'), cancelBtn = $('cancel'), status = $('status'), success = $('success');
  const SUCCESS_MS = 1000;

  function setStatus(text, isError = false) {
    status.textContent = text;
    status.classList.toggle('error', isError);
  }
  function setBusy(busy) {
    importBtn.disabled = busy;
    cancelBtn.hidden = !busy;
  }

  function startImport(raw) {
    let capture;
    try {
      capture = JSON.parse(raw);
    } catch {
      setStatus('El texto no es JSON válido.', true);
      return;
    }
    setBusy(true);
    setStatus('Importando…');
    parent.postMessage({ pluginMessage: { type: 'import', capture } }, '*');
  }

  async function readFile(file) {
    setStatus(`Leyendo ${file.name}…`);
    startImport(await file.text());
  }

  importBtn.onclick = () => {
    if (!textarea.value.trim()) return setStatus('Pega primero el JSON de la captura.', true);
    startImport(textarea.value);
  };
  cancelBtn.onclick = () => parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
  $('file').onchange = (e) => e.target.files[0] && readFile(e.target.files[0]);

  const drop = $('drop');
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => {
    e.preventDefault();
    drop.classList.remove('over');
    const file = e.dataTransfer.files[0];
    if (file) readFile(file);
  };

  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'progress') setStatus(msg.text);
    if (msg.type === 'error') {
      setBusy(false);
      setStatus(msg.text, true);
    }
    if (msg.type === 'done') showSuccess(msg.text, msg.warnings || []);
  };

  /** Muestra el check un segundo y deja la UI lista para pegar otro JSON. */
  function showSuccess(detail, warnings) {
    setStatus('');
    $('success-detail').textContent = detail;
    success.classList.add('show');
    setTimeout(() => {
      success.classList.remove('show');
      textarea.value = '';
      $('file').value = '';
      setBusy(false);
      // Los avisos (fuentes sustituidas, imágenes que fallaron) se quedan a la vista.
      setStatus(warnings.join(' '));
      textarea.focus();
    }, SUCCESS_MS);
  }
</script>
</body>
</html>
